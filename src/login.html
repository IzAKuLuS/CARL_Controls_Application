<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARL Login</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Configuration must load before the shared login behavior. -->
    <script src="passcodes.js" defer></script>
    <script src="auth.js" defer></script>
</head>
<body>
    <main class="selection">
        <h1>CARL Controls</h1>
        <p>Enter your eight-digit passcode.</p>

        <!-- Handle validation ourselves so every incorrect submission counts. -->
        <form id="passcode-form" class="login-form" novalidate>
            <label for="passcode">Passcode</label>
            <input id="passcode" name="passcode" type="password"
                   inputmode="numeric" pattern="[0-9]{8}" minlength="8"
                   maxlength="8" autocomplete="off" required
                   aria-describedby="login-message cooldown">
            <button id="sign-in" class="button" type="submit">Sign in</button>
        </form>

        <p id="login-message" role="status" aria-live="polite"></p>
        <!-- Do not announce the changing countdown every second to screen readers. -->
        <p id="cooldown" role="timer" aria-live="off"></p>
        <p class="login-note">Temporary browser-only access screen.</p>
        <noscript>JavaScript must be enabled to sign in.</noscript>
    </main>
</body>
</html>
